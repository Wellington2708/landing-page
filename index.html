<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,400;0,500;0,600;0,700;1,100;1,200&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/index.css" />
  </head>
  <body>
    <main class="container">
      <section class="container-text">
        <h1 class="container-title">Learn to code by watching others</h1>
        <p class="container-paragraph">
          See how experienced developers solve problemas in real-time. Watching
          scripted tutoriais is great, but understanding how developers think is
          invaluable.
        </p>
      </section>
      <div>
        <h2 class="container-subtitle">
          Try it free 7 days then $20/mo. thereafter
        </h2>
        <section class="container-form">
          <form class="form">
            <input type="text" placeholder="Name" />
            <input type="text" placeholder="Last Name" />
            <input type="email" placeholder="Email Address" />
            <input type="password" placeholder="Password" />
            <button class="container-button">CLAIM YOUR FREE TRIAL</button>
          </form>
          <p class="container-terms">
            By clicking the button, you are agreeing to our
            <strong class="highlight">Terms and Services</strong>
          </p>
        </section>
      </div>
    </main>

      </p>

  </body>
</html>
